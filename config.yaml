web:
  mode: "debug"
  port: "8888"
mysql:
  host: "127.0.0.1"
  port: "3306"
  database: wallet_eth
  user: root
  password: "1234"
# 後端程式讀取的是 node.url / node.confirm (Sepolia 測試網公共節點, 免 Key)
node:
  url:
    - "https://ethereum-sepolia-rpc.publicnode.com"
    - "https://1rpc.io/sepolia"
    - "https://sepolia.gateway.tenderly.co"
  confirm: 12
auth:
  # jwt | redis
  active: "jwt"
  expireTime: "2h"
  # active = jwt 时候生效
  privateKey: "123456"
redis:
  host: "localhost"
  port: "6379"
  password: ""
# 備用節點 (目前程式未使用, 僅保留紀錄)
node_bk:
  url:
    - "https://mainnet.infura.io/v3/9637a86deec84a978afac1d5b958ceaf"
  key: "9637a86deec84a978afac1d5b958ceaf"
log:
  # 环境 dev | prd
  env: dev
  # 输出日志路径
  path: ./log/wallet_eth.log
  # 日志格式 json|console (不填默认console)
  encoding: console
  # 单个文件最大尺寸，默认单位 M  (不填默认100)
  max_size: 10
  # 最大时间，默认单位 day (不填默认不删除备份)
  max_age: 30
  # 最多保留备份个数 (不填默认不删除备份)
  max_backups: 30
